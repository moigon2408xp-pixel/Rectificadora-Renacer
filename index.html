<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#182254" />
  <meta name="description" content="Sistema Integral de Recepción, Diagnóstico, Presupuesto, Asignación por Subtareas, Control de Calidad y Comisiones — Rectificadora Renacer (Job 8:7)." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./logo_renacer.png" />
  <link rel="apple-touch-icon" href="./logo_renacer.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="./styles.css?v=6" />
  <title>Rectificadora Renacer — Sistema de Taller y Producción (Job 8:7)</title>
</head>
<body>
  <div class="app-shell">

    <!-- ==================== PANTALLA DE ACCESO PROFESIONAL ==================== -->
    <section id="login-view" class="unlock-screen">
      <div class="login-bg-decor" aria-hidden="true">
        <div class="login-bg-circle login-bg-circle--1"></div>
        <div class="login-bg-circle login-bg-circle--2"></div>
      </div>

      <div class="login-card-clean">
        <!-- Cabecera de Marca -->
        <div class="login-clean-header">
          <div class="login-logo-wrapper">
            <img src="./logo_renacer.png" alt="Rectificadora Renacer" class="login-logo" />
          </div>
          <span class="login-biblical-badge"><i class="fas fa-book-open"></i> JOB 8:7</span>
          <h1 class="login-clean-title">RECTIFICADORA RENACER</h1>
          <p class="login-clean-sub">Sistema de Gestión de Taller y Producción</p>
        </div>

        <!-- Alerta de sesión anterior (si existe) -->
        <div id="login-resume-banner" class="login-resume-banner hidden">
          <div style="font-size:12.5px; color:#fde047; font-weight:800;">
            <i class="fas fa-user-check"></i> Sesión guardada: <strong id="login-resume-name">Moises Gonzalez</strong>
          </div>
          <button type="button" class="btn btn--gold btn--sm" onclick="resumePreviousSession()" style="padding:4px 10px; font-size:11.5px;">
            Continuar ➔
          </button>
        </div>

        <!-- Formulario de Acceso Limpio -->
        <form id="login-form" class="login-clean-form" onsubmit="handleManualLogin(event)">
          <div class="field-group">
            <label for="login-username-input"><i class="fas fa-user"></i> Usuario o Nombre</label>
            <div class="login-input-wrap">
              <input
                id="login-username-input"
                type="text"
                placeholder="Ej: Moises Gonzalez"
                autocomplete="username"
                list="login-users-datalist"
                required
              />
              <datalist id="login-users-datalist"></datalist>
            </div>
          </div>

          <div class="field-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label for="login-pin-input"><i class="fas fa-lock"></i> Contraseña / PIN Numérico</label>
              <button type="button" class="btn-clean-link" onclick="toggleLoginPinVisibility()">
                <i class="fas fa-eye" id="login-pin-eye-icon"></i> <span id="login-pin-eye-text">Ver</span>
              </button>
            </div>
            <div class="login-input-wrap">
              <input
                id="login-pin-input"
                type="password"
                inputmode="numeric"
                placeholder="Ingresa tu PIN numérico"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#cbd5e1; margin-top:2px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="login-remember-me" checked style="accent-color:var(--renacer-gold); width:16px; height:16px;" />
              Recordar usuario en este equipo
            </label>
          </div>

          <button type="submit" class="btn btn--gold btn--lg" style="width:100%; justify-content:center; padding:13px; font-size:15px; margin-top:6px;">
            <i class="fas fa-sign-in-alt"></i> Entrar al Sistema Renacer
          </button>

          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="btn btn--ghost" style="flex:1; background:rgba(255,255,255,0.06); color:#fff; border-color:rgba(255,255,255,0.18); font-size:12px;" onclick="triggerPwaInstall()">
              <i class="fas fa-download"></i> Instalar App (PC / Teléfono)
            </button>
            <button type="button" class="btn btn--ghost" style="background:rgba(255,255,255,0.06); color:#fde047; border-color:rgba(245,223,0,0.3); font-size:12px;" onclick="resetDemoDatabase()" title="Restaurar datos de ejemplo">
              <i class="fas fa-redo"></i> Demo
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ==================== ÁREA DE TRABAJO PRINCIPAL ==================== -->
    <section id="workspace" class="hidden">
      <!-- HEADER STICKY INDUSTRIAL -->
      <header class="renacer-main-header">
        <a class="renacer-header-brand" onclick="navigateTab('default')">
          <img src="./logo_renacer.png" alt="Rectificadora Renacer" class="renacer-brand-logo" />
          <div>
            <div class="renacer-brand-title">
              RECTIFICADORA RENACER
              <span class="job-pill">JOB 8:7</span>
            </div>
            <div class="renacer-brand-sub" id="header-subtitle-role">
              Control de Ingreso, Troquel, Presupuesto y Asignación
            </div>
          </div>
        </a>

        <!-- Buscador Rápido por Troquel / Cédula / Cliente -->
        <div style="flex:1; max-width:340px; min-width:190px; position:relative;">
          <i class="fas fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:13px;"></i>
          <input
            type="search"
            id="global-search-input"
            placeholder="Buscar Troquel (#5017), Cédula/RIF o Cliente..."
            oninput="handleGlobalSearch(this.value)"
            style="width:100%; padding:8px 12px 8px 34px; border-radius:999px; border:1px solid rgba(245,223,0,0.4); background:rgba(15,23,42,0.75); color:#ffffff; font-size:12.5px; font-weight:600; outline:none;"
          />
        </div>

        <div class="renacer-header-controls">
          <button type="button" id="btn-header-new-order" class="header-action-btn header-action-btn--gold" onclick="openNewOrderModal()">
            <i class="fas fa-plus-circle"></i>
            <span>Nueva Orden</span>
          </button>

          <button type="button" id="btn-header-cloud-sync" class="header-action-btn" style="background:rgba(22,163,74,0.18); color:#86efac; border:1px solid rgba(34,197,94,0.55);" onclick="openCloudSyncModal()" title="Sincronización con Google Sheets">
            <i class="fas fa-cloud" id="cloud-sync-badge-icon"></i>
            <span id="cloud-sync-badge-label">Sheets</span>
          </button>

          <button type="button" class="control-btn-circle" onclick="toggleTheme()" title="Cambiar Modo Claro / Oscuro">
            <i class="fas fa-moon" id="theme-icon"></i>
          </button>

          <!-- Selector Rápido de Usuario -->
          <div class="user-role-pill" onclick="openSwitchUserModal()" title="Cambiar de usuario">
            <span class="role-dot"></span>
            <i class="fas fa-user"></i>
            <span id="active-user-label">Jesús Andrade</span>
            <i class="fas fa-chevron-down" style="font-size:10px; opacity:0.8;"></i>
          </div>

          <button type="button" class="control-btn-circle" style="background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.45);" onclick="logout()" title="Cerrar sesión">
            <i class="fas fa-power-off"></i>
          </button>
        </div>
      </header>

      <!-- BARRA DE PESTAÑAS DINÁMICA SEGÚN ROL -->
      <nav id="renacer-tabs-bar" class="renacer-tabs-bar"></nav>

      <!-- CONTENIDO DE LA PANTALLA ACTIVA -->
      <main id="screen" class="main-workspace" aria-live="polite"></main>

      <!-- NAVEGACIÓN INFERIOR MÓVIL -->
      <nav id="mobile-bottom-nav" class="mobile-bottom-nav"></nav>
    </section>

    <!-- CONTENEDOR DE MODALES Y NOTIFICACIONES -->
    <div id="modal-root"></div>
    <div id="toast" class="renacer-toast hidden" role="status"></div>

  </div>

  <script src="./app.js?v=6"></script>
</body>
</html>
