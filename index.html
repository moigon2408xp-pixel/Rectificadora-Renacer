<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#182254" />
  <meta name="description" content="Sistema Integral de Recepción, Diagnóstico, Presupuesto, Asignación por Subtareas, Control de Calidad y Comisiones — Rectificadora Renacer (Job 8:7)." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./logo_renacer.png" />
  <link rel="apple-touch-icon" href="./logo_renacer.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="./styles.css?v=8" />
  <title>Rectificadora Renacer — Sistema de Taller y Producción (Job 8:7)</title>
</head>
<body>
  <div class="app-shell">

    <!-- ==================== PANTALLA DE ACCESO PROFESIONAL ==================== -->
    <section id="login-view" class="unlock-screen">
      <div class="login-bg-decor" aria-hidden="true">
        <div class="login-bg-circle login-bg-circle--1"></div>
        <div class="login-bg-circle login-bg-circle--2"></div>
      </div>

      <div class="login-card-clean">
        <!-- Cabecera de Marca -->
        <div class="login-clean-header">
          <div class="login-logo-wrapper">
            <img src="./logo_renacer.png" alt="Rectificadora Renacer" class="login-logo" />
          </div>
          <span class="login-biblical-badge"><i class="fas fa-book-open"></i> JOB 8:7</span>
          <h1 class="login-clean-title">RECTIFICADORA RENACER</h1>
          <p class="login-clean-sub">Sistema de Gestión de Taller y Producción</p>
        </div>

        <!-- Alerta de sesión anterior (si existe) -->
        <div id="login-resume-banner" class="login-resume-banner hidden">
          <div style="font-size:12.5px; color:#fde047; font-weight:800;">
            <i class="fas fa-user-check"></i> Sesión guardada: <strong id="login-resume-name">Moises Gonzalez</strong>
          </div>
          <button type="button" class="btn btn--gold btn--sm" onclick="resumePreviousSession()" style="padding:4px 10px; font-size:11.5px;">
            Continuar ➔
          </button>
        </div>

        <!-- Formulario de Acceso Limpio -->
        <form id="login-form" class="login-clean-form" onsubmit="handleManualLogin(event)">
          <div class="field-group">
            <label for="login-username-input"><i class="fas fa-user"></i> Usuario o Nombre</label>
            <div class="login-input-wrap">
              <input
                id="login-username-input"
                type="text"
                placeholder="Ej: Moises Gonzalez"
                autocomplete="username"
                list="login-users-datalist"
                required
              />
              <datalist id="login-users-datalist"></datalist>
            </div>
          </div>

          <div class="field-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label for="login-pin-input"><i class="fas fa-lock"></i> Contraseña / PIN Numérico</label>
              <button type="button" class="btn-clean-link" onclick="toggleLoginPinVisibility()">
                <i class="fas fa-eye" id="login-pin-eye-icon"></i> <span id="login-pin-eye-text">Ver</span>
              </button>
            </div>
            <div class="login-input-wrap">
              <input
                id="login-pin-input"
                type="password"
                inputmode="numeric"
                placeholder="Ingresa tu PIN numérico"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#cbd5e1; margin-top:2px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="login-remember-me" checked style="accent-color:var(--renacer-gold); width:16px; height:16px;" />
              Recordar usuario en este equipo
            </label>
          </div>

          <button type="submit" class="btn btn--gold btn--lg" style="width:100%; justify-content:center; padding:13px; font-size:15px; margin-top:6px;">
            <i class="fas fa-sign-in-alt"></i> Entrar al Sistema Renacer
          </button>

          <button type="button" class="btn btn--ghost" style="width:100%; border-color:rgba(245,223,0,0.4); color:#fde047; margin-top:8px; font-size:13px; font-weight:800; background:rgba(245,223,0,0.06);" onclick="handleBiometricLogin()">
            <i class="fas fa-fingerprint"></i> Ingresar con Huella Dactilar
          </button>

          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="btn btn--ghost" style="flex:1; background:rgba(255,255,255,0.06); color:#fff; border-color:rgba(255,255,255,0.18); font-size:12px;" onclick="triggerPwaInstall()">
              <i class="fas fa-download"></i> Instalar App (PC / Teléfono)
            </button>
            <button type="button" class="btn btn--ghost" style="background:rgba(255,255,255,0.06); color:#fde047; border-color:rgba(245,223,0,0.3); font-size:12px;" onclick="resetDemoDatabase()" title="Restaurar datos de ejemplo">
              <i class="fas fa-redo"></i> Demo
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ==================== ÁREA DE TRABAJO PRINCIPAL (LAYOUT CON BARRA LATERAL TIPO TUULAPP) ==================== -->
    <section id="workspace" class="hidden renacer-workspace-layout">
      <!-- SIDEBAR LATERAL (DISEÑO OFICIAL JESÚS ANDRADE / RENACER) -->
      <aside id="renacer-sidebar" class="renacer-sidebar">
        <!-- Logo y Marca Renacer -->
        <div class="sidebar-brand-box" onclick="navigateTab('default')">
          <div class="sidebar-logo-ring">
            <img src="./logo_renacer.png" alt="Rectificadora Renacer" class="sidebar-logo" />
          </div>
          <div class="sidebar-brand-info">
            <div class="sidebar-brand-title">RENACER</div>
            <div class="sidebar-brand-sub"><i class="fas fa-book-open"></i> JOB 8:7</div>
          </div>
        </div>

        <!-- Menú de Navegación Vertical -->
        <nav class="sidebar-nav-menu" id="renacer-tabs-bar"></nav>

        <!-- Pie de Barra Lateral -->
        <div class="sidebar-bottom-status">
          <button type="button" id="btn-sidebar-cloud-sync" class="sidebar-sync-pill" onclick="openCloudSyncModal()" title="Sincronización con Google Sheets">
            <i class="fas fa-cloud" id="cloud-sync-badge-icon"></i>
            <span id="cloud-sync-badge-label">Sheets Conectado</span>
          </button>
          <div style="display:flex; gap:6px; margin-top:8px; width:100%;">
            <button type="button" class="btn btn--ghost btn--xs" style="flex:1; font-size:10.5px; padding:4px 6px; border-color:rgba(255,255,255,0.15);" onclick="forceAppRefresh()" title="Forzar actualización y limpiar caché">
              <i class="fas fa-sync-alt"></i> <span class="sidebar-text-hide">Actualizar</span>
            </button>
            <button type="button" class="btn btn--ghost btn--xs" style="flex:1; font-size:10.5px; padding:4px 6px; border-color:rgba(255,255,255,0.15);" onclick="openInteractiveProfileModal()" title="Mi Perfil y Ajustes">
              <i class="fas fa-user-cog"></i> <span class="sidebar-text-hide">Perfil</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- CONTENEDOR PRINCIPAL VIEWPORT -->
      <div class="renacer-main-viewport">
        <!-- TOPBAR INDUSTRIAL CON BUSCADOR, RANGO DE FECHAS Y ACCIONES -->
        <header class="renacer-main-topbar">
          <div class="topbar-left-zone">
            <!-- Botón Móvil para Abrir Menú Lateral -->
            <button type="button" class="sidebar-mobile-toggle" onclick="toggleSidebarMenu()" title="Menú">
              <i class="fas fa-bars"></i>
            </button>

            <!-- Buscador Global -->
            <div class="topbar-search-box">
              <i class="fas fa-search search-icon"></i>
              <input
                type="search"
                id="global-search-input"
                class="topbar-search-input"
                placeholder="Buscar Troquel (#5017), Cédula/RIF, Cliente o Motor..."
                oninput="handleGlobalSearch(this.value)"
              />
            </div>

            <!-- Rango de Fechas (Diseño Jesús Andrade) -->
            <div class="topbar-date-range-filter">
              <div class="date-pill">
                <i class="far fa-calendar-alt"></i>
                <span>DESDE</span>
                <input type="date" id="topbar-date-from" onchange="applyDateRangeFilter()" />
              </div>
              <div class="date-pill">
                <i class="far fa-calendar-alt"></i>
                <span>HASTA</span>
                <input type="date" id="topbar-date-to" onchange="applyDateRangeFilter()" />
              </div>
              <button type="button" class="btn-week-filter" onclick="setDateFilterCurrentWeek()">
                Semana Actual
              </button>
            </div>
          </div>

          <div class="topbar-right-zone">
            <!-- Botón Colapsar / Expandir Sidebar (Desktop) -->
            <button type="button" class="control-btn-circle desktop-sidebar-toggle" onclick="toggleSidebarCollapse()" title="Colapsar / Expandir Barra Lateral">
              <i class="fas fa-bars-staggered"></i>
            </button>

            <!-- Botón + Nueva Orden -->
            <button type="button" id="btn-header-new-order" class="btn-topbar-action btn-topbar-action--gold" onclick="openNewOrderModal()">
              <i class="fas fa-plus-circle"></i>
              <span>Nueva Orden</span>
            </button>

            <!-- Selector / Perfil Interactivo de Usuario -->
            <div class="topbar-user-pill" onclick="openInteractiveProfileModal()" title="Mi Perfil & Configuración">
              <span class="user-live-dot"></span>
              <i class="fas fa-user-circle"></i>
              <span id="active-user-label">Jesús Andrade</span>
              <i class="fas fa-chevron-down" style="font-size:10px; opacity:0.8;"></i>
            </div>

            <!-- Notificaciones Push -->
            <button type="button" id="btn-push-notifications" class="control-btn-circle" onclick="togglePushNotifications()" title="Activar / Comprobar Notificaciones Push">
              <i class="fas fa-bell"></i>
              <span id="push-status-dot" class="push-status-dot hidden"></span>
            </button>

            <!-- Botón Forzar Actualización -->
            <button type="button" class="control-btn-circle" onclick="forceAppRefresh()" title="Forzar Actualización (Limpiar Caché y Recargar)">
              <i class="fas fa-sync-alt"></i>
            </button>

            <!-- Botones de Sistema -->
            <button type="button" class="control-btn-circle" onclick="toggleTheme()" title="Cambiar Modo Claro / Oscuro">
              <i class="fas fa-moon" id="theme-icon"></i>
            </button>

            <button type="button" class="control-btn-circle" style="background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.45);" onclick="logout()" title="Cerrar sesión">
              <i class="fas fa-power-off"></i>
            </button>
          </div>
        </header>

        <!-- CONTENIDO DE LA PANTALLA ACTIVA -->
        <main id="screen" class="main-workspace" aria-live="polite"></main>

        <!-- Barra de Acciones Rápidas Flotante para Móviles (Para Sr. Enrique y Jefes en Teléfono) -->
        <div id="mobile-quick-actions-bar" class="mobile-quick-actions-bar">
          <button type="button" class="quick-action-pill quick-action-pill--gold" onclick="openNewOrderModal()">
            <i class="fas fa-plus"></i> <span>+ Orden</span>
          </button>
          <button type="button" class="quick-action-pill quick-action-pill--green" onclick="openQuickCashMovementModal('ingreso')">
            <i class="fas fa-arrow-down"></i> <span>+ Ingreso</span>
          </button>
          <button type="button" class="quick-action-pill quick-action-pill--red" onclick="openQuickCashMovementModal('egreso')">
            <i class="fas fa-arrow-up"></i> <span>+ Egreso</span>
          </button>
          <button type="button" class="quick-action-pill quick-action-pill--blue" onclick="navigateTab('accounts_receivable')">
            <i class="fas fa-hand-holding-usd"></i> <span>Por Cobrar</span>
          </button>
        </div>
      </div>

      <!-- NAVEGACIÓN INFERIOR MÓVIL (PANTALLAS PEQUEÑAS) -->
      <nav id="mobile-bottom-nav" class="mobile-bottom-nav"></nav>
    </section>

    <!-- CONTENEDOR DE MODALES Y NOTIFICACIONES -->
    <div id="modal-root"></div>
    <div id="toast" class="renacer-toast hidden" role="status"></div>

  </div>

  <script src="./app.js?v=8"></script>
</body>
</html>
